name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/fem.test.cjs
      - name: Verify published HTML contains the tested source
        run: node --test tests/bundle.test.cjs
